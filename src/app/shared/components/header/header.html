<header class="cine-header">
  <div class="logo">
    <h1 routerLink="/">Cine UTN</h1>
  </div>
  
  <nav class="navegacion">
    <a routerLink="/cartelera">Cartelera</a>
    <a routerLink="/preventas">Preventas</a>
    <a routerLink="/candy">Candy Bar</a>
  </nav>

  <div class="buscador">
    <input type="text" placeholder="Buscar película o género..." (input)="onSearch($event)" />
  </div>

  <div class="header-auth-section">
    @if (usuario()) {
      <div class="usuario-logueado">
        
        @if (perfil()?.rol === 'empleado') {
          <button class="btn-logout btn-empleado btn-espaciado" routerLink="/validacion-qr">
            Validar Entradas
          </button>
        }

        @if (perfil()?.rol === 'cliente') {
        <button class="btn-logout btn-espaciado" routerLink="/mis-entradas">
          Mis Entradas
        </button>
        <span class="puntos-badge">⭐ {{ perfil()?.puntos || puntos() }} pts</span>
        }
        
        @if (perfil()?.rol === 'admin') {
          <button class="btn-logout btn-admin btn-espaciado" routerLink="/admin-panel">
            ⚙️ Panel Admin
          </button>
        }

        <span class="saludo">Hola, {{ perfil()?.nombre || 'Cinéfilo' }}</span>
        
        <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
      </div>
    } @else {
      <button class="btn-login" routerLink="/login">Iniciar Sesión</button>
    }
  </div>
</header>
